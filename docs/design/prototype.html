<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Bodoni+Moda:ital,opsz,wght@1,6..96,500;1,6..96,600&display=swap">
<style>
/* Layout: app shell — navy sidebar + workspace; package colors from the Waoo logo code every event chip. */
:root{
  --bg:#F4F5FA; --surface:#FFFFFF; --surface-2:#EEF0F8; --ink:#141A33; --muted:#5A6283; --line:#DCE0EE;
  --navy:#122F94; --navy-ink:#FFFFFF; --sidebar:#0E1B52; --sidebar-ink:#C9D0F0;
  --teal:#15D1C4; --purple:#8D53D9; --pink:#FF017C; --yellow:#F9C930;
  --ok:#137A4B; --ok-bg:#E3F5EC; --warn:#9A6200; --warn-bg:#FFF2D6; --bad:#B4233A; --bad-bg:#FDE6EA; --info:#1E4DD8; --info-bg:#E5ECFF;
  --font:"Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --accent-font:"Bodoni Moda", Georgia, "Times New Roman", serif;
  --r:12px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1026; --surface:#141A38; --surface-2:#1B2247; --ink:#EEF1FF; --muted:#A3AACC; --line:#2A3263;
  --navy:#6F8BFF; --navy-ink:#0B1026; --sidebar:#070B1C; --sidebar-ink:#AEB6DD;
  --ok:#5CD69B; --ok-bg:#12352A; --warn:#F5C35A; --warn-bg:#3A2D0E; --bad:#FF7A8E; --bad-bg:#3D1620; --info:#8FA8FF; --info-bg:#1A2550;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0B1026; --surface:#141A38; --surface-2:#1B2247; --ink:#EEF1FF; --muted:#A3AACC; --line:#2A3263;
  --navy:#6F8BFF; --navy-ink:#0B1026; --sidebar:#070B1C; --sidebar-ink:#AEB6DD;
  --ok:#5CD69B; --ok-bg:#12352A; --warn:#F5C35A; --warn-bg:#3A2D0E; --bad:#FF7A8E; --bad-bg:#3D1620; --info:#8FA8FF; --info-bg:#1A2550;
  color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.side{background:var(--sidebar);color:var(--sidebar-ink);padding-block:20px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh}
.brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:800;font-size:20px;letter-spacing:-.02em;padding:0 8px}
.brand .dots{display:flex;gap:3px}.brand .dots i{width:8px;height:8px;border-radius:50%;display:block}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--sidebar-ink);letter-spacing:.08em;text-transform:uppercase}
nav.menu{display:flex;flex-direction:column;gap:2px}
nav.menu button{background:none;border:0;text-align:left;padding:9px 10px;border-radius:9px;color:var(--sidebar-ink);display:flex;align-items:center;gap:10px;font-weight:500}
nav.menu button:hover{background:rgba(255,255,255,.06);color:#fff}
nav.menu button[aria-current="page"]{background:rgba(255,255,255,.12);color:#fff}
nav.menu svg{width:18px;height:18px;flex:none}
.badge{margin-left:auto;background:var(--pink);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;font-weight:700}
.side .foot{margin-top:auto;font-size:12px;padding:0 8px;opacity:.8}
main{min-width:0;padding-block:22px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto}
.proto-note{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:16px}
header.page{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
h1{margin:0;font-size:28px;letter-spacing:-.02em;font-weight:700;text-wrap:balance}
h1 em{font-family:var(--accent-font);font-weight:500;color:var(--navy)}
h2{margin:0 0 10px;font-size:16px;font-weight:700}
.sub{color:var(--muted);margin:4px 0 0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600}
.btn.primary{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.split{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.todo{display:flex;flex-direction:column;gap:4px;border-left:4px solid var(--line)}
.todo b{font-size:28px;line-height:1}
.todo.bad{border-left-color:var(--bad)}.todo.warn{border-left-color:var(--yellow)}.todo.info{border-left-color:var(--navy)}.todo.ok{border-left-color:var(--teal)}
.todo span{color:var(--muted);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.info{background:var(--info-bg);color:var(--info)}
.pkg{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none}
.p-star{background:var(--yellow)}.p-magic{background:var(--purple)}.p-mg{background:var(--teal)}.p-mg2{background:var(--pink)}.p-waoo{background:var(--navy)}
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .when{font-weight:700}.row .when small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.row .what{min-width:0}.row .what div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .what small{color:var(--muted)}
.money{display:grid;gap:8px}
.money .line{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}
.money .line:last-child{border-bottom:0}
.money .total{font-size:22px;font-weight:800;color:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--surface-2);border-radius:999px;padding:5px 11px;font-weight:600;font-size:13px}
/* calendar */
.cal{display:grid;grid-template-columns:52px repeat(2,minmax(0,1fr));gap:0;overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.cal .hd{padding:10px;font-weight:700;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface)}
.cal .hours{border-right:1px solid var(--line)}
.cal .hours div{height:56px;font-size:11px;color:var(--muted);text-align:right;padding-right:6px;transform:translateY(-6px)}
.day{position:relative;border-right:1px solid var(--line);min-width:220px;background:repeating-linear-gradient(to bottom,transparent 0 55px,var(--line) 55px 56px)}
.day:last-child{border-right:0}
.ev{position:absolute;left:8px;right:8px;border-radius:10px;padding:6px 9px;color:#fff;font-size:12.5px;overflow:hidden;box-shadow:0 1px 0 rgba(0,0,0,.08)}
.ev b{display:block;font-size:13px}
.ev.star{background:#B98A00}.ev.magic{background:var(--purple)}.ev.mg2{background:#D1006A}.ev.waoo{background:#122F94}.ev.mg{background:#0E9E94}
.travel{position:absolute;left:8px;right:8px;border-radius:8px;background:repeating-linear-gradient(135deg,var(--surface-2) 0 6px,transparent 6px 12px);border:1px dashed var(--line);font-size:11px;color:var(--muted);padding:3px 8px}
.conflict{position:absolute;left:8px;right:8px;border-radius:8px;border:2px solid var(--bad);background:var(--bad-bg);color:var(--bad);font-size:12px;padding:5px 8px;font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
/* event file */
.status-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:6px 12px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;min-width:0}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em;padding:8px 6px;border-bottom:1px solid var(--line)}
td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right}
.tbl{overflow-x:auto}
.admin-only{border:1px dashed var(--purple);border-radius:var(--r)}
.admin-only .tag{font-size:11px;font-weight:700;color:var(--purple);text-transform:uppercase;letter-spacing:.08em}
.pending{color:var(--warn);font-style:italic}
/* portal */
.phone{max-width:380px;margin:0 auto;border:10px solid var(--sidebar);border-radius:34px;background:#fff;color:#141A33;overflow:hidden}
.phone .top{background:#122F94;color:#fff;padding:18px 18px 22px}
.phone .top .lang{float:right;font-size:12px;border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:2px 9px;background:none;color:#fff}
.phone h3{margin:6px 0 2px;font-size:22px}
.phone .body{padding:16px;display:grid;gap:12px}
.step{border:1px solid #DCE0EE;border-radius:12px;padding:12px}
.step .n{font-size:11px;font-weight:700;color:#5A6283;text-transform:uppercase;letter-spacing:.08em}
.step.done{background:#E3F5EC;border-color:#BFE7D2}
.phone .pay{display:grid;gap:8px}
.phone .opt{border:2px solid #DCE0EE;border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;gap:8px;background:#fff;color:#141A33;text-align:left}
.phone .opt[aria-pressed="true"]{border-color:#122F94;background:#EEF2FF}
.phone .cta{background:#FF017C;color:#fff;border:0;border-radius:12px;padding:13px;font-weight:800;font-size:16px}
.phone label{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.phone input[type=text]{width:100%;border:1px solid #DCE0EE;border-radius:10px;padding:10px;font:inherit;background:#fff;color:#141A33}
.phone small{color:#5A6283}
/* report email */
.mail{max-width:560px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.mail .mh{background:var(--navy);color:var(--navy-ink);padding:18px 22px}
.mail .mh h3{margin:0;font-size:20px}.mail .mh p{margin:4px 0 0;opacity:.85;font-size:13px}
.mail .mb{padding:20px 22px;display:grid;gap:14px}
.big{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.big div{background:var(--surface-2);border-radius:12px;padding:12px}
.big b{display:block;font-size:24px}.big span{font-size:12px;color:var(--muted)}
.bar{height:12px;border-radius:999px;background:var(--surface-2);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.tabs{display:none}
.mobile-nav{display:none}
@media (max-width:980px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.split,.g3{grid-template-columns:1fr}}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  main{padding-bottom:90px}
  .mobile-nav{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--sidebar);padding:8px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));gap:4px;overflow-x:auto;z-index:5}
  .mobile-nav button{background:none;border:0;color:var(--sidebar-ink);font-size:12px;padding:6px 10px;border-radius:8px;white-space:nowrap}
  .mobile-nav button[aria-current="page"]{background:rgba(255,255,255,.14);color:#fff}
  .g2{grid-template-columns:1fr}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .todo{padding:12px}.todo b{font-size:24px}
  .kv{grid-template-columns:110px minmax(0,1fr)}
  h1{font-size:23px}
}
@media (prefers-reduced-motion:no-preference){.screen{animation:in .18s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>

<template id="t-evento">

        <div class="card"><h2>Pagos</h2><div class="tbl"><table>
          <thead><tr><th>Concepto</th><th>Método</th><th class="r">Monto</th><th>Estado</th></tr></thead>
          <tbody>
            <tr><td>Paquete Waoo</td><td></td><td class="r num">$800.00</td><td></td></tr>

<script>
(function(){
  var screens=[
    {id:"inicio",label:"Inicio",icon:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',badge:"4"},
    {id:"calendario",label:"Calendario",icon:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>'},
    {id:"evento",label:"Ficha de evento",icon:'<path d="M5 4h14v16H5z"/><path d="M8 9h8M8 13h8M8 17h5"/>'},
    {id:"cotizacion",label:"Cotización",icon:'<path d="M12 3v18M7 7h7a3 3 0 0 1 0 6H9a3 3 0 0 0 0 6h8"/>'},
    {id:"portal",label:"Portal clienta",icon:'<rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/>'},
    {id:"staff",label:"Staff y trajes",icon:'<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5M17 11a3 3 0 1 0 0-6M21 20c0-2-1-4-3-4.5"/>'},
    {id:"reportes",label:"Reportes",icon:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'}
  ];
  var menu=document.getElementById("menu"), mnav=document.getElementById("mnav"), host=document.getElementById("screens");
  screens.forEach(function(s){
    var b=document.createElement("button"); b.type="button"; b.dataset.go=s.id;
    b.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+s.icon+'</svg>'+s.label+(s.badge?'<span class="badge">'+s.badge+'</span>':'');
    menu.appendChild(b);
    var m=document.createElement("button"); m.type="button"; m.dataset.go=s.id; m.textContent=s.label; mnav.appendChild(m);
  });
  function show(id){
    if(!document.getElementById("t-"+id)) id="inicio";
    host.innerHTML=""; host.appendChild(document.getElementById("t-"+id).content.cloneNode(true));
    document.querySelectorAll("[data-go]").forEach(function(b){ if(b.closest(".menu,.mobile-nav")) b.setAttribute("aria-current", b.dataset.go===id?"page":"false"); });
    if(id==="cotizacion") quote();
    if(id==="portal") portal();
    try{ history.replaceState(null,"","#"+id);}catch(e){}
    window.scrollTo(0,0);
  }
  document.addEventListener("click",function(e){ var b=e.target.closest("[data-go]"); if(b){ show(b.dataset.go);} });

  // quote builder: prices from the live website; travel fee by ZIP is a sample value
  function quote(){
    var pk=[["Estrella",275,"p-star",1,null],["Mágico",375,"p-magic",1,150],["Música y Juegos",525,"p-mg",0,null],["MyJ 2.0",600,"p-mg2",1,150],["Waoo",800,"p-waoo",1,150]];
    var ad=[["Face painting 1 h",200],["Foam cannon 1 h",300],["Photo booth 3 h",420],["Robot LED alto",500]];
    var st={p:4,c:1,a:{}};
    var travel={"77494":20,"77433":40,"77479":40};
    function money(n){return "$"+n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});}
    function render(){
      if(!pk[st.p][4]) st.c=1; var p=pk[st.p], extraC=(p[3]&&p[4])?Math.max(0,st.c-1)*p[4]:0, addTot=0;
      Object.keys(st.a).forEach(function(k){ if(st.a[k]) addTot+=ad[k][1]; });
      var zip=document.getElementById("q-zip").value.trim(), t=travel[zip];
      var total=p[1]+extraC+addTot+(t||0), dep=Math.round(total*50)/100, tp=(t===undefined);
      document.getElementById("chars").textContent=p[3]?(st.c+(st.c===1?" personaje":" personajes")):"Sin personaje";
      document.getElementById("q-total").innerHTML=
        '<div class="line"><span>'+p[0]+'</span><b class="num">'+money(p[1])+'</b></div>'+
        (extraC?'<div class="line"><span>Personajes extra</span><b class="num">'+money(extraC)+'</b></div>':'')+
        Object.keys(st.a).filter(function(k){return st.a[k];}).map(function(k){return '<div class="line"><span>'+ad[k][0]+'</span><b class="num">'+money(ad[k][1])+'</b></div>';}).join("")+
        '<div class="line"><span>Costo de transporte ('+zip+')</span><b class="num">'+(t!==undefined?money(t):'<span class="pending">calculando…</span>')+'</b></div>'+
        '<div class="line"><span><b>Total</b></span><b class="num">'+money(total)+(tp?' + transporte':'')+'</b></div>'+
        (tp?'<div class="line"><span>Depósito 50 %</span><span class="pending">se calcula al confirmar el transporte</span></div>':'<div class="line"><span>Depósito 50 % para asegurar la fecha</span><span class="total num">'+money(dep)+'</span></div>');
      document.getElementById("xc-note").textContent=p[3]?(p[4]?"Personaje extra +$"+p[4]+" (precio de "+p[0]+")":"Personaje extra: precio pendiente de tu catálogo"):"Este paquete no incluye personaje";
      document.getElementById("q-cost").innerHTML="Se calcula con el staff que pongas para <b>"+p[0]+"</b> en tu hoja de catálogo y las tarifas por rol. Hoy faltan datos: aparecerá aquí con la ganancia estimada.";
      document.querySelectorAll("#pkgs button").forEach(function(b,i){b.setAttribute("aria-pressed",i===st.p?"true":"false"); b.style.borderColor=i===st.p?"var(--navy)":""; b.style.background=i===st.p?"var(--info-bg)":"";});
      document.querySelectorAll("#addons button").forEach(function(b,i){b.setAttribute("aria-pressed",st.a[i]?"true":"false"); b.style.background=st.a[i]?"var(--info-bg)":"";});
    }
    var g=document.getElementById("pkgs");
    pk.forEach(function(p,i){var b=document.createElement("button");b.type="button";b.className="btn";b.style.textAlign="left";b.innerHTML='<span class="pkg '+p[2]+'"></span> '+p[0]+'<br><small class="num" style="color:var(--muted)">desde $'+p[1]+'</small>';b.onclick=function(){st.p=i;render();};g.appendChild(b);});
    var a=document.getElementById("addons");
    ad.forEach(function(x,i){var b=document.createElement("button");b.type="button";b.className="chip";b.style.border="1px solid var(--line)";b.textContent=x[0]+" · $"+x[1];b.onclick=function(){st.a[i]=!st.a[i];render();};a.appendChild(b);});
    document.getElementById("chars-plus").onclick=function(){ if(pk[st.p][3]&&pk[st.p][4]&&st.c<3){st.c++;render();} };
    document.getElementById("chars-minus").onclick=function(){ if(st.c>1){st.c--;render();} };
    document.getElementById("q-zip").addEventListener("input",render);
    render();
  }

  function portal(){
    var es=true, card=false;
    var T={es:{t:"¡Hola, Ana!",s:"Tu fiesta Waoo · sábado 24 de octubre · 2:00 pm",s1n:"1 · Cotización",s1t:"Aceptada ✓",s2n:"2 · Contrato",s2t:"Lee el contrato completo y escribe tu nombre para firmar.",ag:"Leí y acepto el contrato. Mi firma electrónica vale igual que una firma a mano.",s3n:"3 · Depósito (50 %)",zt:"Sin cargo extra",ct:"Tarjeta",cft:"Crédito: +3 % de cargo",zi:'Envía <b>$410.00</b> por Zelle a <b>Waoo Party LLC</b> · 346-216-8739 · nota: <b>WP-1042</b>. Te confirmamos al verificarlo.',ci:"Pagarás con tarjeta en la página segura de Stripe.",cta:"Firmar y pagar",note:"Tu fecha queda asegurada cuando recibimos tu pago.",need:"Escribe tu nombre y marca la casilla para firmar.",ok:"Listo (ejemplo): contrato firmado. Con Zelle, tu fecha se asegura al verificar el pago."},
             en:{t:"Hi, Ana!",s:"Your Waoo party · Saturday, October 24 · 2:00 pm",s1n:"1 · Quote",s1t:"Accepted ✓",s2n:"2 · Contract",s2t:"Read the full contract and type your name to sign.",ag:"I have read and accept the contract. My electronic signature is as valid as a handwritten one.",s3n:"3 · Deposit (50%)",zt:"No extra fee",ct:"Card",cft:"Credit: +3% fee",zi:'Send <b>$410.00</b> by Zelle to <b>Waoo Party LLC</b> · 346-216-8739 · memo: <b>WP-1042</b>. We confirm once verified.',ci:"You'll pay by card on Stripe's secure page.",cta:"Sign and pay",note:"Your date is secured when we receive your payment.",need:"Type your name and check the box to sign.",ok:"Done (example): contract signed. With Zelle, your date is secured once we verify the payment."}};
    function tr(){var x=es?T.es:T.en; [["pt-title","t"],["pt-sub","s"],["s1n","s1n"],["s1t","s1t"],["s2n","s2n"],["s2t","s2t"],["agree-t","ag"],["s3n","s3n"],["zt","zt"],["ct","ct"],["cft","cft"],["cta","cta"],["note","note"]].forEach(function(p){document.getElementById(p[0]).textContent=x[p[1]];}); document.getElementById("zi").innerHTML=card?x.ci:x.zi;}
    document.getElementById("lang").onclick=function(){es=!es;tr();};
    document.getElementById("opt-zelle").onclick=function(){card=false;this.setAttribute("aria-pressed","true");document.getElementById("opt-card").setAttribute("aria-pressed","false");tr();};
    document.getElementById("opt-card").onclick=function(){card=true;this.setAttribute("aria-pressed","true");document.getElementById("opt-zelle").setAttribute("aria-pressed","false");tr();};
    document.getElementById("cta").onclick=function(){var x=es?T.es:T.en; var ok=document.getElementById("sig").value.trim().length>3&&document.getElementById("agree").checked; document.getElementById("note").textContent=ok?x.ok:x.need;};
    tr();
  }
  var start=(location.hash||"#inicio").slice(1); show(start);
})();
</script>
