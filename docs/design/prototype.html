<title>Waoo CRM Prototipo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Bodoni+Moda:ital,opsz,wght@1,6..96,500;1,6..96,600&display=swap">
<style>
/* Layout: navy sidebar + calm workspace. One primary action per screen; logo colors code each package. */
:root{
  --bg:#F5F6FB; --surface:#FFFFFF; --surface-2:#EEF1F9; --ink:#141A33; --muted:#5B6385; --faint:#8A91B0; --line:#DFE3EF;
  --navy:#122F94; --navy-2:#1F42C2; --navy-ink:#FFFFFF; --sidebar:#0E1B52; --sidebar-ink:#C3CAEC;
  --teal:#15D1C4; --purple:#8D53D9; --pink:#FF017C; --yellow:#F9C930;
  --ok:#11734A; --ok-bg:#E2F5EB; --warn:#8F5B00; --warn-bg:#FFF1D2; --bad:#B4233A; --bad-bg:#FDE6EA; --info:#1E4DD8; --info-bg:#E6EDFF;
  --shadow:0 1px 2px rgba(20,26,51,.05),0 8px 24px rgba(20,26,51,.06);
  --font:"Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --accent-font:"Bodoni Moda", Georgia, "Times New Roman", serif;
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1026; --surface:#141A38; --surface-2:#1C2349; --ink:#EEF1FF; --muted:#A6AED0; --faint:#7C84AA; --line:#2A3263;
  --navy:#7A93FF; --navy-2:#93A7FF; --navy-ink:#0B1026; --sidebar:#070B1C; --sidebar-ink:#AEB6DD;
  --ok:#5CD69B; --ok-bg:#12352A; --warn:#F5C35A; --warn-bg:#3A2D0E; --bad:#FF7A8E; --bad-bg:#3D1620; --info:#8FA8FF; --info-bg:#1A2550;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0B1026; --surface:#141A38; --surface-2:#1C2349; --ink:#EEF1FF; --muted:#A6AED0; --faint:#7C84AA; --line:#2A3263;
  --navy:#7A93FF; --navy-2:#93A7FF; --navy-ink:#0B1026; --sidebar:#070B1C; --sidebar-ink:#AEB6DD;
  --ok:#5CD69B; --ok-bg:#12352A; --warn:#F5C35A; --warn-bg:#3A2D0E; --bad:#FF7A8E; --bad-bg:#3D1620; --info:#8FA8FF; --info-bg:#1A2550;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100%}
/* sidebar */
.side{background:var(--sidebar);color:var(--sidebar-ink);padding-block:18px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:12px;display:flex;flex-direction:column;gap:14px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:800;font-size:20px;letter-spacing:-.02em;padding:2px 10px 6px}
.brand .dots{display:grid;grid-template-columns:repeat(2,8px);gap:3px}.brand .dots i{width:8px;height:8px;border-radius:50%;display:block}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--sidebar-ink);letter-spacing:.08em;text-transform:uppercase}
.quick{background:var(--pink);color:#fff;border:0;border-radius:12px;padding:11px 12px;font-weight:700;display:flex;align-items:center;gap:8px;justify-content:center}
.quick:hover{filter:brightness(1.07)}
nav.menu{display:flex;flex-direction:column;gap:2px}
.menu .grp{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.4);padding:10px 10px 4px}
nav.menu button{background:none;border:0;text-align:left;padding:9px 10px;border-radius:10px;color:var(--sidebar-ink);display:flex;align-items:center;gap:10px;font-weight:500}
nav.menu button:hover{background:rgba(255,255,255,.07);color:#fff}
nav.menu button[aria-current="page"]{background:rgba(255,255,255,.13);color:#fff}
nav.menu svg{width:18px;height:18px;flex:none}
.badge{margin-left:auto;background:var(--pink);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;font-weight:700}
.side .foot{margin-top:auto;font-size:12px;padding:0 10px;opacity:.75}
/* main */
main{min-width:0;padding-block:18px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto}
.topbar{display:flex;gap:10px;align-items:center;margin-bottom:16px}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px;min-width:0}
.search input{border:0;background:none;outline:0;width:100%;min-width:0}
.search svg{width:18px;height:18px;color:var(--faint);flex:none}
.who{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;white-space:nowrap}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--navy);color:var(--navy-ink);display:grid;place-items:center;font-weight:700;font-size:13px}
.proto-note{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:8px 12px;font-size:13px;margin:0 0 16px}
header.page{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
h1{margin:0;font-size:28px;letter-spacing:-.02em;font-weight:700;text-wrap:balance}
h1 em{font-family:var(--accent-font);font-weight:500;color:var(--navy)}
h2{margin:0 0 4px;font-size:17px;font-weight:700}
h3{margin:0;font-size:15px;font-weight:700}
.sub{color:var(--muted);margin:4px 0 0}
.hint{color:var(--muted);font-size:13px;margin:0 0 12px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:9px 14px;font-weight:600;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{border-color:var(--navy)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.btn.primary:hover{background:var(--navy-2)}
.btn.pink{background:var(--pink);border-color:var(--pink);color:#fff}
.btn.danger{color:var(--bad)}
.btn.ghost{border-color:transparent;background:none;color:var(--navy)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:9px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.split{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0;box-shadow:var(--shadow)}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.todo{display:flex;gap:12px;align-items:center;text-align:left;width:100%;cursor:pointer}
.todo .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;font-weight:800;font-size:18px}
.todo b{display:block;font-size:14px}.todo span{color:var(--muted);font-size:12.5px}
.todo:hover{border-color:var(--navy)}
.ic.bad{background:var(--bad-bg);color:var(--bad)}.ic.warn{background:var(--warn-bg);color:var(--warn)}.ic.info{background:var(--info-bg);color:var(--info)}.ic.ok{background:var(--ok-bg);color:var(--ok)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.info{background:var(--info-bg);color:var(--info)}.pill.mute{background:var(--surface-2);color:var(--muted)}
.pkg{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none;vertical-align:baseline}
.p-star{background:var(--yellow)}.p-magic{background:var(--purple)}.p-mg{background:var(--teal)}.p-mg2{background:var(--pink)}.p-waoo{background:var(--navy)}
.list .row{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 8px;border-top:1px solid var(--line);border-radius:10px;cursor:pointer}
.list .row:first-child{border-top:0}
.list .row:hover{background:var(--surface-2)}
.row .when{font-weight:700}.row .when small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.row .what{min-width:0}.row .what div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.row .what small{color:var(--muted)}
.money .line{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line)}
.money .line:last-child{border-bottom:0}
.money .total{font-size:22px;font-weight:800;color:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--surface-2);border-radius:999px;padding:5px 11px;font-weight:600;font-size:13px;border:1px solid transparent}
button.chip:hover{border-color:var(--navy)}
.chip[aria-pressed="true"]{background:var(--info-bg);border-color:var(--navy);color:var(--info)}
/* forms */
.field{display:grid;gap:5px;min-width:0;align-content:start}
.field label{font-weight:600;font-size:13.5px}
.field .help{font-size:12px;color:var(--muted)}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:10px 12px;min-width:0}
.input:focus{border-color:var(--navy);outline:0;box-shadow:0 0 0 3px var(--info-bg)}
.choice-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.choice{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;text-align:left;display:grid;gap:2px}
.choice small{color:var(--muted)}
.choice[aria-pressed="true"]{border-color:var(--navy);background:var(--info-bg)}
.stepnum{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--navy);color:var(--navy-ink);font-weight:800;font-size:13px;margin-right:8px}
.section-t{display:flex;align-items:center;margin:4px 0 10px}
/* progress tracker */
.track{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:12px}
.track div{display:grid;gap:6px;font-size:12.5px;color:var(--muted)}
.track i{height:6px;border-radius:999px;background:var(--line);display:block}
.track .done i{background:var(--ok)}.track .done{color:var(--ink)}
.track .now i{background:var(--yellow)}.track .now{color:var(--ink);font-weight:700}
/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 12px;border-bottom:2.5px solid transparent;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--navy);border-bottom-color:var(--navy)}
.kv{display:grid;grid-template-columns:140px minmax(0,1fr);gap:8px 12px;font-size:14px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0;min-width:0}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;padding:8px 6px;border-bottom:1px solid var(--line)}
td{padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.tbl{overflow-x:auto}
.admin-only{border:1.5px dashed var(--purple)}
.tag{font-size:11px;font-weight:700;color:var(--purple);text-transform:uppercase;letter-spacing:.08em}
.pending{color:var(--warn);font-style:italic}
.callout{display:flex;gap:10px;background:var(--info-bg);color:var(--info);border-radius:12px;padding:10px 12px;font-size:13.5px}
.callout.ok{background:var(--ok-bg);color:var(--ok)}.callout.warn{background:var(--warn-bg);color:var(--warn)}
.copybox{display:flex;gap:8px;align-items:stretch}
.copybox .input{font-size:13px}
.msgbox{background:var(--surface-2);border-radius:12px;padding:12px;font-size:14px;white-space:pre-line}
/* calendar */
.cal{display:grid;grid-template-columns:52px repeat(2,minmax(220px,1fr));overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.cal .hd{padding:10px;font-weight:700;border-bottom:1px solid var(--line)}
.cal .hours{border-right:1px solid var(--line)}
.cal .hours div{height:56px;font-size:11px;color:var(--muted);text-align:right;padding-right:6px;transform:translateY(-6px)}
.day{position:relative;border-right:1px solid var(--line);background:repeating-linear-gradient(to bottom,transparent 0 55px,var(--line) 55px 56px)}
.day:last-child{border-right:0}
.ev{position:absolute;left:8px;right:8px;border-radius:10px;padding:6px 9px;color:#fff;font-size:12.5px;overflow:hidden;border:0;text-align:left}
.ev b{display:block;font-size:13px}
.ev.star{background:#A77C00}.ev.magic{background:#7B3FCB}.ev.mg2{background:#C9005F}.ev.waoo{background:#122F94}
.travel{position:absolute;left:8px;right:8px;border-radius:8px;background:repeating-linear-gradient(135deg,var(--surface-2) 0 6px,transparent 6px 12px);border:1px dashed var(--line);font-size:11px;color:var(--muted);padding:3px 8px}
.conflict{position:absolute;right:8px;width:52%;border-radius:8px;border:2px solid var(--bad);background:var(--bad-bg);color:var(--bad);font-size:12px;padding:5px 8px;font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
/* dialogs */
dialog{border:0;border-radius:18px;padding:0;max-width:min(520px,calc(100vw - 32px));width:100%;background:var(--surface);color:var(--ink);box-shadow:0 30px 80px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,14,40,.55)}
.dlg{padding:20px;display:grid;gap:14px}
.dlg-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
/* portal */
.phone{max-width:380px;margin:0 auto;border:10px solid var(--sidebar);border-radius:34px;background:#fff;color:#141A33;overflow:hidden}
.phone .top{background:#122F94;color:#fff;padding:18px 18px 22px}
.phone .lang{float:right;font-size:12px;border:1px solid rgba(255,255,255,.45);border-radius:999px;padding:2px 9px;background:none;color:#fff}
.phone h3{margin:8px 0 2px;font-size:22px}
.phone .body{padding:16px;display:grid;gap:12px}
.pstep{border:1px solid #DFE3EF;border-radius:14px;padding:12px;display:grid;gap:8px}
.pstep .n{font-size:11px;font-weight:700;color:#5B6385;text-transform:uppercase;letter-spacing:.08em}
.pstep.done{background:#E2F5EB;border-color:#BFE7D2}
.phone .pin{border:1px solid #DFE3EF;border-radius:10px;padding:10px;width:100%;background:#fff;color:#141A33}
.phone label.pl{font-size:12.5px;font-weight:600;color:#3A4166}
.phone .cta{background:#FF017C;color:#fff;border:0;border-radius:12px;padding:13px;font-weight:800;font-size:16px}
.phone .chk{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.phone small{color:#5B6385}
/* report */
.mail{max-width:560px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.mail .mh{background:var(--navy);color:var(--navy-ink);padding:18px 22px}
.mail .mh h3{margin:0;font-size:20px}.mail .mh p{margin:4px 0 0;opacity:.85;font-size:13px}
.mail .mb{padding:20px 22px;display:grid;gap:14px}
.big{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.big div{background:var(--surface-2);border-radius:12px;padding:12px}
.big b{display:block;font-size:24px}.big span{font-size:12px;color:var(--muted)}
.bar{height:12px;border-radius:999px;background:var(--surface-2);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.pkgcard{display:grid;gap:8px;border-top:4px solid var(--line)}
.pkgcard .price{font-size:22px;font-weight:800}
.crew{display:flex;flex-wrap:wrap;gap:6px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:20;box-shadow:var(--shadow)}
.mobile-nav{display:none}
.temp-note{display:flex;gap:10px;align-items:flex-start;background:var(--warn-bg);color:var(--warn);border-radius:var(--r);padding:12px 14px;font-size:var(--fs-sm);font-weight:600;margin-bottom:16px}
.phase{display:grid;grid-template-columns:minmax(0,1fr) 64px;gap:6px 14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.phase:first-of-type{border-top:0}
.phase h3{margin:0;font-size:var(--fs-md)}.phase p{margin:2px 0 0;color:var(--muted);font-size:var(--fs-sm)}
.phase .pct{font-size:22px;font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.phase .bar{grid-column:1/-1;height:10px}
.phase.now{background:linear-gradient(90deg,rgba(255,1,124,.06),transparent);margin:0 -14px;padding:14px}
.phase{cursor:pointer}.phase:focus-visible{outline:none;box-shadow:var(--focus);border-radius:10px}
.dl{border-top:1px solid var(--line);padding:10px 0;display:grid;gap:6px}.dl:first-child{border-top:0}
.dl b{font-size:var(--fs-sm)}.dl small{color:var(--muted);font-size:var(--fs-xs)}
.stg{display:flex;flex-wrap:wrap;gap:4px}.stg span{font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--surface-2);color:var(--faint)}
.stg span.on{background:var(--ok-bg);color:var(--ok)}.stg span.na{opacity:.45}
.blk{font-size:var(--fs-xs);color:var(--warn);background:var(--warn-bg);border-radius:8px;padding:3px 8px;justify-self:start}
.steps-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.steps-list li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;font-size:var(--fs-sm)}
.steps-list li b{font-weight:700}
.steps-list .st{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff}
.st.ok{background:var(--ok)}.st.wip{background:var(--warn)}.st.todo{background:var(--line);color:var(--muted)}
@media (max-width:1000px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.split,.g3{grid-template-columns:1fr}}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  main{padding-bottom:96px}
  .who span{display:none}
  .mobile-nav{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--sidebar);padding:8px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));gap:4px;overflow-x:auto;z-index:5}
  .mobile-nav button{background:none;border:0;color:var(--sidebar-ink);font-size:12px;padding:6px 10px;border-radius:8px;white-space:nowrap}
  .mobile-nav button.qk{background:var(--pink);color:#fff;font-weight:700}
  .mobile-nav button[aria-current="page"]{background:rgba(255,255,255,.14);color:#fff}
  .g2{grid-template-columns:1fr}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kv{grid-template-columns:110px minmax(0,1fr)}
  .track{grid-template-columns:repeat(5,minmax(52px,1fr));overflow-x:auto}
  h1{font-size:23px}
}
@media (prefers-reduced-motion:no-preference){.screen{animation:in .18s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>

<div class="app">
  <aside class="side" aria-label="Menú">
    <div class="brand"><span class="dots"><i style="background:var(--yellow)"></i><i style="background:var(--teal)"></i><i style="background:var(--pink)"></i><i style="background:var(--purple)"></i></span><span>Waoo CRM<small>Waoo Party LLC</small></span></div>

  function stageScore(d){
    var S=PROGRESS.stage_scores, sc=0;
    if(d.backend) sc+= d.ui===null ? S.backend+S.ui : S.backend;
    if(d.ui && d.backend) sc+=S.ui;
    if(d.reviewed) sc+=S.reviewed; if(d.merged) sc+=S.merged; if(d.accepted) sc+=S.accepted;
    return Math.min(1,sc);
  }
