name: CRM backend
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
# A newer commit on the same branch/PR cancels the older run; main always finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, pdo_sqlite, intl, bcmath, mbstring, pcntl, zip
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.lock') }}
      - run: composer install --no-interaction --prefer-dist
      - run: composer validate --strict
      - run: composer audit --locked
      - name: PHP syntax
        run: find app bootstrap config database routes tests tools -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: npm ci --ignore-scripts && npm run build

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    name: test (${{ matrix.shard }}/5)
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: ci-only-disposable-password
          MARIADB_DATABASE: waoo_phase1_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: waoo_phase1_test
      DB_USERNAME: root
      DB_PASSWORD: ci-only-disposable-password
      SESSION_SECURE_COOKIE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, pdo_sqlite, intl, bcmath, mbstring, pcntl, zip
          coverage: none
          tools: composer:v2
      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.lock') }}
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      # Each shard has its own MariaDB; every test file runs in exactly one shard (tools/ci-shard.php checks it).
      - run: php tools/ci-shard.php 5 ${{ matrix.shard }} > phpunit-shard.xml
      - run: vendor/bin/phpunit --configuration=phpunit-shard.xml
