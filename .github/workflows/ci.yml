name: CRM backend
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: ci-only-disposable-password
          MARIADB_DATABASE: waoo_phase1_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: waoo_phase1_test
      DB_USERNAME: root
      DB_PASSWORD: ci-only-disposable-password
      SESSION_SECURE_COOKIE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, intl, bcmath, mbstring, pcntl, zip
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: composer validate --strict
      - run: composer audit --locked
      - run: cp .env.example .env && php artisan key:generate
      - name: PHP syntax
        run: find app bootstrap config database routes tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php artisan test
      - run: npm ci --ignore-scripts && npm run build
